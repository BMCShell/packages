name: Sync public packages

on:
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-public-packages
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'BMCShell/packages' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Mirror and verify release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/sync-source.ps1
      - name: Publish source index
        shell: bash
        run: |
          git add -- index.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update public package index'
          git push origin HEAD:refs/heads/main
