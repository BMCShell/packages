name: Sync public packages

on:
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-public-packages
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'BMCShell/packages' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check source access
        id: source-access
        shell: bash
        env:
          SOURCE_RELEASES_TOKEN: ${{ secrets.SOURCE_RELEASES_TOKEN }}
        run: |
          if [[ -n "$SOURCE_RELEASES_TOKEN" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo '::error::Configure SOURCE_RELEASES_TOKEN for the private plugin releases.'
            exit 1
          else
            echo '::notice::Scheduled sync skipped until SOURCE_RELEASES_TOKEN is configured.'
          fi
      - uses: actions/checkout@v6
        if: steps.source-access.outputs.enabled == 'true'
      - name: Mirror and verify release assets
        if: steps.source-access.outputs.enabled == 'true'
        shell: pwsh
        env:
          SOURCE_RELEASES_TOKEN: ${{ secrets.SOURCE_RELEASES_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/sync-source.ps1
      - name: Publish source index
        if: steps.source-access.outputs.enabled == 'true'
        shell: bash
        run: |
          git add -- index.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update public package index'
          git push origin HEAD:refs/heads/main
